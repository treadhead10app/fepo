<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanks Analytics — FEPO Football Handicapping Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071019; --bg-elev:#0d1f2e; --teal:#17C9B2; --blue:#4FC3F7;
    --text:#E8F5F3; --text-muted:#79A0AE; --hairline:rgba(79,195,247,0.16);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:36px 20px 60px}
  a.back{color:var(--teal);text-decoration:none;font-size:14px}
  h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em;color:var(--blue);font-size:clamp(24px,6vw,32px);margin:18px 0 8px}
  p.sub{color:var(--text-muted);margin:0 0 28px;font-size:15px}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:640px){ .grid{grid-template-columns:1fr 1fr} }
  .card{border:1px solid var(--hairline);border-radius:14px;overflow:hidden;background:var(--bg-elev)}
  .card img{width:100%;display:block}
  .empty{border:1px dashed var(--hairline);border-radius:14px;padding:40px 20px;text-align:center;color:var(--text-muted);font-size:14px}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back</a>
    <h1>Hanks Analytics</h1>
    <p class="sub">Weekly charts and breakdowns will appear here.</p>
    <div class="grid" id="gallery"></div>
    <div class="empty" id="emptyState" style="display:none">No analytics posted yet this week — check back soon.</div>
  </div>
<script>
  fetch('content.json', {cache:'no-store'})
    .then(r => r.ok ? r.json() : {})
    .then(data => {
      const images = (data.hanksAnalytics && data.hanksAnalytics.images) || [];
      const gallery = document.getElementById('gallery');
      if(!images.length){
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      images.forEach(src => {
        const card = document.createElement('div');
        card.className = 'card';
        const img = document.createElement('img');
        img.src = src;
        img.alt = 'Hanks Analytics chart';
        card.appendChild(img);
        gallery.appendChild(card);
      });
    })
    .catch(() => { document.getElementById('emptyState').style.display = 'block'; });
</script>
</body>
</html>
